# With `[filter].enabled = true`, a UID is intercepted when any package
# sharing that UID is listed in `scoop`.
# Filter deny settings still apply to every package resolved for the UID.
# Optional per-package settings can be added under [scoop.<package>].
# Example:
# [scoop.io.github.vvb2060.keyattestation]
# keybox_slot = 1
# attest_key_fallback = true

version = 1

scoop = [
  "io.github.vvb2060.keyattestation",
  "com.google.android.gsf",
  "com.google.android.gms",
  "com.android.vending",
  "com.eltavine.duckdetector",
  "com.tencent.soter.soterserver",
  "net.one97.paytm",
  "my.com.tngdigital.ewallet",
]

[main]
enabled = true
log_level = "debug"
debug_logging = false

[filter]
enabled = true
deny_packages = []
block_android_package = true
allow_unknown_package = false

[intercept]
get_security_level = true
get_key_entry = true
update_subcomponent = true
list_entries = true
delete_key = true
grant = true
ungrant = true
get_number_of_entries = true
list_entries_batched = true
get_supplementary_attestation_info = true
